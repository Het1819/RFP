<tr id="req-row-{{ req.id }}" style="background: rgba(14, 165, 233, 0.03);">
    <td style="text-align: center; width: 40px;" data-label="Select">
        <input type="checkbox" disabled style="width: 16px; height: 16px; opacity: 0.5;">
    </td>
    <td data-label="Sec / Page">
        <input type="text" name="source_section" class="input-text" value="{{ req.source_section or '' }}" placeholder="Sec" style="font-size: 0.85rem; border-radius: var(--radius-sm);">
        <input type="number" name="source_page" class="input-text" style="margin-top: 0.25rem; font-size: 0.85rem; border-radius: var(--radius-sm);" value="{{ req.source_page or '' }}" placeholder="Page">
    </td>
    <td data-label="Requirement Text">
        <textarea name="original_text" class="input-text" style="height: 80px; resize: vertical; font-size: 0.9rem; line-height: 1.4; border-radius: var(--radius-sm);" required>{{ req.original_text }}</textarea>
    </td>
    <td data-label="Type">
        <select name="requirement_type" class="input-text" style="font-size: 0.85rem; border-radius: var(--radius-sm); background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0.45rem;">
            <option value="" {% if not req.requirement_type %}selected{% endif %}>None</option>
            <option value="Technical" {% if req.requirement_type == 'Technical' %}selected{% endif %}>Technical</option>
            <option value="Compliance" {% if req.requirement_type == 'Compliance' %}selected{% endif %}>Compliance</option>
            <option value="Commercial" {% if req.requirement_type == 'Commercial' %}selected{% endif %}>Commercial</option>
            <option value="Procedural" {% if req.requirement_type == 'Procedural' %}selected{% endif %}>Procedural</option>
        </select>
    </td>
    <td style="text-align: center;" data-label="Mandatory">
        <input type="checkbox" name="mandatory" value="true" {% if req.mandatory %}checked{% endif %} style="cursor: pointer; width: 16px; height: 16px;">
    </td>
    <td data-label="Status">
        <select name="status" class="input-text" style="font-size: 0.85rem; border-radius: var(--radius-sm); background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0.45rem;">
            <option value="NOT_STARTED" {% if req.status == 'NOT_STARTED' %}selected{% endif %}>NOT_STARTED</option>
            <option value="DRAFTED" {% if req.status == 'DRAFTED' %}selected{% endif %}>DRAFTED</option>
            <option value="NEEDS_EVIDENCE" {% if req.status == 'NEEDS_EVIDENCE' %}selected{% endif %}>NEEDS_EVIDENCE</option>
            <option value="NEEDS_REVIEW" {% if req.status == 'NEEDS_REVIEW' %}selected{% endif %}>NEEDS_REVIEW</option>
            <option value="APPROVED" {% if req.status == 'APPROVED' %}selected{% endif %}>APPROVED</option>
            <option value="REJECTED" {% if req.status == 'REJECTED' %}selected{% endif %}>REJECTED</option>
        </select>
    </td>
    <td data-label="Owner">
        <input type="text" name="owner_name" class="input-text" value="{{ req.owner_name or '' }}" placeholder="Owner" style="font-size: 0.85rem; border-radius: var(--radius-sm); margin-bottom: 0.25rem;">
        <input type="text" name="proposal_section" class="input-text" style="font-size: 0.85rem; border-radius: var(--radius-sm);" value="{{ req.proposal_section or '' }}" placeholder="Proposal Sec">
    </td>
    <td data-label="Risk">
        <select name="risk_level" class="input-text" style="font-size: 0.85rem; border-radius: var(--radius-sm); background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0.45rem;">
            <option value="Low" {% if req.risk_level == 'Low' or not req.risk_level %}selected{% endif %}>Low</option>
            <option value="Medium" {% if req.risk_level == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="High" {% if req.risk_level == 'High' %}selected{% endif %}>High</option>
        </select>
    </td>
    <td style="text-align: right;" data-label="Actions">
        <div style="display: inline-flex; gap: 0.35rem; justify-content: flex-end; flex-wrap: wrap;">
            <button type="button" hx-post="/requirements/{{ req.id }}/edit" hx-include="closest tr" hx-target="#req-row-{{ req.id }}" hx-swap="outerHTML" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: var(--radius-sm);">Save</button>
            <button type="button" hx-get="/requirements/{{ req.id }}/cancel" hx-target="#req-row-{{ req.id }}" hx-swap="outerHTML" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: var(--radius-sm);">Cancel</button>
        </div>
    </td>
</tr>
