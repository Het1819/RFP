services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rfp_architect
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: rfp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp_user -d rfp_architect"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local clamd for manual/pytest use against a real daemon. Dev doesn't
  # run `app`/`worker` in Compose, so there's no healthcheck-gated
  # depends_on here -- just point CLAMAV_HOST=localhost (and
  # CLAMAV_PORT=3310) at this from a locally-run app/worker process or
  # pytest run.
  clamd:
    image: clamav/clamav@sha256:e7ead98e7e07231b151bce988e0cfb0a3b46e6e7046d9dd44fd838c0df724a03
    ports:
      - "3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  clamav_signatures:
