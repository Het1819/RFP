services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - AUTH_MODE=session
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg://rfp_user:rfp_password@postgres:5432/rfp_architect
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_ENABLED=true
      - LLM_PROVIDER=fake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      - APP_ENV=production
      - AUTH_MODE=session
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg://rfp_user:rfp_password@postgres:5432/rfp_architect
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_ENABLED=true
      - LLM_PROVIDER=fake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rfp_architect
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: rfp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp_user -d rfp_architect"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
