name: CI Quality Gates

on:
  push:
    branches:
      - main
      - master
      - hardening-pilot-readiness
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run mypy app

      - name: Run Pytest Suite
        run: uv run pytest -q
        env:
          APP_ENV: test
          AUTH_MODE: session
          SESSION_SECRET_KEY: "test-session-secret-key-32-chars-minimum"
          APP_SECRET_KEY: "test-app-secret-key-32-chars-minimum"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run assets:build

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

  ai-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Offline AI Evals
        run: uv run python scripts/run_ai_eval.py --offline

      - name: Upload Eval Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: evals/results/eval_report_offline.json
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose -f docker-compose.prod.yml config
        env:
          SESSION_SECRET_KEY: "test-session-secret-key-32-chars-minimum"

      - name: Build Docker Image
        run: docker build -t rfp-architect-mvp:ci .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and pip-audit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv pip install --system pip-audit

      - name: Run Python Dependency Audit
        run: |
          uv pip compile pyproject.toml -o requirements.txt
          pip-audit -r requirements.txt

      - name: Run Node Dependency Audit
        run: npm audit --audit-level=high

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  release-gate:
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
      - ai-evals
      - docker-build
      - security-scan
    steps:
      - name: Verify All Gates Passed
        run: echo "All release gates verified successfully."
