# Shared reverse-proxy settings for locations forwarding to the app.
#
# Forwarded headers are set to a SINGLE AUTHORITATIVE VALUE from Nginx's
# own observed connection -- never $proxy_add_x_forwarded_for (which
# appends to whatever the inbound client sent). Any X-Forwarded-For,
# X-Real-IP, X-Forwarded-Proto/Host/Port, or Forwarded header the client
# sent is discarded here and replaced outright.
#
# proxy_pass targets a variable (resolved at request time via Docker's
# embedded DNS) rather than a static hostname: this lets `nginx -t`
# validate config without the "app" service needing to be resolvable, and
# makes Nginx resilient to the app container restarting with a new IP
# without requiring an Nginx reload.
set $upstream_app app:8000;
proxy_pass http://$upstream_app;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Request-ID $request_id_final;
proxy_set_header Forwarded "for=$remote_addr;proto=https;host=$host";
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;

proxy_buffering on;
proxy_redirect off;

# NOTE: X-Request-ID is added as a response header at the SERVER level
# (see templates/default.conf.template), not here. nginx's add_header
# inheritance rule is all-or-nothing per location: a location block that
# defines ANY add_header of its own stops inheriting the server-level
# ones entirely. Since this file is `include`d inside every proxying
# location, an add_header here would silently drop HSTS/CSP/etc. from
# every proxied response.
