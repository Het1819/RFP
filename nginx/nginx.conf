# Hardened Nginx main config for the RFP Architect MVP edge boundary.
# See DEPLOYMENT.md for the full edge threat model and rationale.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured (JSON) logs. Deliberately excludes cookies, Authorization
    # headers, CSRF tokens, and full query strings -- only $uri (path, no
    # query) is logged, never $request_uri, so sensitive query values never
    # land in a log line.
    log_format edge escape=json
        '{"time":"$time_iso8601","request_id":"$request_id_final",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_status":"$upstream_status",'
        '"host":"$host"}';

    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    server_tokens off;

    # Docker Compose's embedded DNS resolver -- used so proxy_pass targets
    # (see proxy_common.conf) resolve at request time instead of once at
    # config load, tolerating the app container restarting with a new IP.
    resolver 127.0.0.11 valid=30s;

    # Writable temp paths live on the tmpfs mounts declared in
    # docker-compose.prod.yml -- the container root filesystem itself is
    # read-only. Uploaded request bodies may transiently exist here while a
    # request is being proxied; this is bounded, in-memory (tmpfs), and
    # never a persistent host path.
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Application document limit is 10MB (settings.MAX_UPLOAD_SIZE); this
    # allows a small margin for multipart/form-data framing overhead, not a
    # materially larger ceiling.
    client_max_body_size 11m;

    large_client_header_buffers 4 8k;

    # Defense-in-depth edge rate/connection limits. Independent of, and not
    # a replacement for, the application's account-aware Redis login
    # throttling (app.core.sessions.throttling). Provisional pilot defaults.
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Request ID: accept a syntactically safe inbound X-Request-ID, else
    # fall back to Nginx's own randomly generated $request_id.
    map $http_x_request_id $req_id_in {
        "~*^[a-zA-Z0-9-]{1,64}$" $http_x_request_id;
        default "";
    }
    map $req_id_in $request_id_final {
        "" $request_id;
        default $req_id_in;
    }

    include /etc/nginx/conf.d/*.conf;
}
